<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="application-version" content="">
    <meta name="robots" content="noindex">
    <title>Uppdaterar Tidrapporten</title>
    <style>
        body {
            font: 16px system-ui, sans-serif;
            color: #183b35;
            margin: 12vh auto;
            max-width: 36rem;
            padding: 1.25rem;
        }

        main {
            border: 1px solid #cddad4;
            border-radius: 14px;
            padding: 1.5rem;
            background: #f7faf8;
        }

        button {
            min-height: 44px;
            border: 0;
            border-radius: 9px;
            background: #315e50;
            color: white;
            font: inherit;
            font-weight: 650;
            padding: .65rem 1rem;
        }

        p {
            line-height: 1.5;
        }
    </style>
</head>
<body>
<main>
    <h1>Tidrapporten uppdateras</h1>
    <p id="status" role="status">Den gamla appcachen tas bort. Dina tidsregistreringar och kontouppgifter lämnas
        kvar.</p>
    <button id="update" type="button">Hämta senaste versionen</button>
</main>
<script type="module" src="/js/force-update.js"></script>
</body>
</html>
