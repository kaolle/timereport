quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:8}
%prod.quarkus.datasource.jdbc.min-size=0
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
# Development and tests bind locally; Cloud Run must listen on the container interface.
%dev.quarkus.http.host=127.0.0.1
%test.quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/timereport}
%dev.quarkus.datasource.username=${DB_USERNAME:timereport}
%dev.quarkus.datasource.password=${DB_PASSWORD:}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Tests use an isolated PostgreSQL container, never the local timereport database.
%test.quarkus.datasource.devservices.image-name=postgres:17
%test.quarkus.datasource.devservices.reuse=false
# JWT access tokens expire after five minutes. Dev/test generate keys when none are configured.
auth.issuer=timereport
mp.jwt.verify.issuer=${auth.issuer}
mp.jwt.verify.audiences=timereport
mp.jwt.verify.publickey.algorithm=RS256
smallrye.jwt.expiration.grace=0
# JwtKeyConfigSource maps JWT_PRIVATE_KEY/JWT_PUBLIC_KEY or their _PATH alternatives
# only when supplied, preserving generated dev/test keys when no keys are configured.
auth.public-url=${PUBLIC_URL:http://localhost:8080}
%prod.auth.public-url=${PUBLIC_URL}
%test.auth.public-url=http://localhost:8081
auth.cookie-secure=true
%dev.auth.cookie-secure=false
%test.auth.cookie-secure=false
quarkus.http.auth.permission.auth-public.paths=/api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/logout,/api/auth/forgot-password,/api/auth/reset-password,/api/auth/verify-email
quarkus.http.auth.permission.auth-public.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.mailer.from=${MAIL_FROM:noreply@example.invalid}
%prod.quarkus.mailer.from=${MAIL_FROM}
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
%prod.quarkus.mailer.mock=false
%prod.quarkus.mailer.host=${SMTP_HOST}
%prod.quarkus.mailer.port=${SMTP_PORT:587}
%prod.quarkus.mailer.username=${SMTP_USERNAME}
%prod.quarkus.mailer.password=${SMTP_PASSWORD}
%prod.quarkus.mailer.start-tls=REQUIRED
%test.auth.ip-limit=10000
quarkus.http.limits.max-body-size=64K
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'
# Cloud Run terminates TLS. Secure cookies do not depend on the internal HTTP scheme.
# Keep forwarded headers untrusted until a specific proxy trust policy is configured.
quarkus.http.proxy.proxy-address-forwarding=false
%prod.quarkus.log.level=INFO
%prod.quarkus.console.color=false
%prod.quarkus.log.file.enabled=false
%prod.quarkus.http.access-log.enabled=false
# Never log SMTP conversations containing credentials or account links.
%prod.quarkus.log.category."io.vertx.ext.mail".level=INFO
%prod.quarkus.mailer.log-invalid-recipients=false
%prod.quarkus.mailer.log-rejected-recipients=false
